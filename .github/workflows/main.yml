name: Build and Push to Docker Hub & Update Configs

on:
  push:
    branches:
      - main
      - test-branch  # Replace with your actual test branch name if different

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}
          tags: |
            \({{ secrets.DOCKER_USERNAME }}/maneish_repoexplorer_frontend:\){{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/maneish_repoexplorer_frontend:latest

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Server
          file: ./Server/dockerfile
          push: true
          tags: |
            \({{ secrets.DOCKER_USERNAME }}/maneish_repoexplorer_backend:\){{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/maneish_repoexplorer_backend:latest

      - name: Update Frontend Config Repository
        env:
          PAT_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
          FRONTEND_REPO: ${{ github.ref_name == 'main' && 'REPO_EXPLORER_FRONTEND_CONFIG' || 'REPO_EXPLORER_FRONTEND_CONFIG_TEST' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone the correct frontend config repo dynamically using shell variable
          git clone https://\({{ secrets.CONFIG_REPO_PAT }}@github.com/\){{ github.repository_owner }}/$FRONTEND_REPO.git frontend-config
          cd frontend-config
          
          # Update deployment YAML image reference
          sed -i 's|image:.*maneish_repoexplorer_frontend:.*|image: \({{ secrets.DOCKER_USERNAME }}/maneish_repoexplorer_frontend:\){{ github.sha }}|g' templates/repoexplorer_frontend.yaml
          
          git add templates/repoexplorer_frontend.yaml
          git commit -m "chore(frontend): update image tag to ${{ github.sha }}"
          git push origin main

      - name: Update Backend Config Repository
        env:
          PAT_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
          BACKEND_REPO: ${{ github.ref_name == 'main' && 'REPO_EXPLORER_BACKEND_CONFIG' || 'REPO_EXPLORER_BACKEND_CONFIG_TEST' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone the correct backend config repo dynamically using shell variable
          git clone https://\({{ secrets.CONFIG_REPO_PAT }}@github.com/\){{ github.repository_owner }}/$BACKEND_REPO.git backend-config
          cd backend-config
          
          # Update deployment YAML image reference
          sed -i 's|image:.*maneish_repoexplorer_backend:.*|image: \({{ secrets.DOCKER_USERNAME }}/maneish_repoexplorer_backend:\){{ github.sha }}|g' templates/repoexplorer_backend.yaml
          
          git add templates/repoexplorer_backend.yaml
          git commit -m "chore(backend): update image tag to ${{ github.sha }}"
          git push origin main
