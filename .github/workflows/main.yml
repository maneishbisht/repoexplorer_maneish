name: Build and Push to Docker Hub & Update Configs

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/MANEISH_REPOEXPLORER_FRONTEND:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/MANEISH_REPOEXPLORER_FRONTEND:latest

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Server
          file: ./Server/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/MANEISH_REPOEXPLORER_BACKEND:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/MANEISH_REPOEXPLORER_BACKEND:latest

      - name: Update Frontend Config Repository
        env:
          PAT_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone the frontend config repo using the PAT and owner context
          git clone https://${{ secrets.CONFIG_REPO_PAT }}@github.com/${{ github.repository_owner }}/REPO_EXPLORER_FRONTEND_CONFIG.git frontend-config
          cd frontend-config
          
          # Target the specific Deployment YAML file (repoexplorer_frontend.yaml)
          # Updates the image reference field with the new repository and commit SHA tag
          sed -i 's|image:.*MANEISH_REPOEXPLORER_FRONTEND:.*|image: ${{ secrets.DOCKER_USERNAME }}/MANEISH_REPOEXPLORER_FRONTEND:${{ github.sha }}|g' templates/repoexplorer_frontend.yaml
          
          git add templates/repoexplorer_frontend.yaml
          git commit -m "chore(frontend): update image tag to ${{ github.sha }}"
          git push origin main

      - name: Update Backend Config Repository
        env:
          PAT_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone the backend config repo using the PAT and owner context
          git clone https://${{ secrets.CONFIG_REPO_PAT }}@github.com/${{ github.repository_owner }}/REPO_EXPLORER_BACKEND_CONFIG.git backend-config
          cd backend-config
          
          # Target the specific Deployment YAML file (repoexplorer_backend.yaml)
          # Updates the image reference field with the new repository and commit SHA tag
          sed -i 's|image:.*MANEISH_REPOEXPLORER_BACKEND:.*|image: ${{ secrets.DOCKER_USERNAME }}/MANEISH_REPOEXPLORER_BACKEND:${{ github.sha }}|g' templates/repoexplorer_backend.yaml
          
          git add templates/repoexplorer_backend.yaml
          git commit -m "chore(backend): update image tag to ${{ github.sha }}"
          git push origin main
