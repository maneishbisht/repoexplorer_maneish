name: Build and Push to Docker Hub & Update Configs

on:
  push:
    branches:
      - main
      - test-branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Environment Variables
        id: vars
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "FRONTEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/maneish_repoexplorer_frontend" >> "$GITHUB_OUTPUT"
            echo "BACKEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/maneish_repoexplorer_backend" >> "$GITHUB_OUTPUT"
            echo "IS_PROD=true" >> "$GITHUB_OUTPUT"
          else
            echo "FRONTEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/maneish_repoexplorer_frontend_test" >> "$GITHUB_OUTPUT"
            echo "BACKEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/maneish_repoexplorer_backend_test" >> "$GITHUB_OUTPUT"
            echo "IS_PROD=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------
      # FRONTEND
      # ---------------------------------------------------------

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}
          tags: |
            ${{ steps.vars.outputs.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ steps.vars.outputs.FRONTEND_IMAGE }}:latest

      # ---------------------------------------------------------
      # BACKEND
      # ---------------------------------------------------------

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Server
          file: ./Server/dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ steps.vars.outputs.BACKEND_IMAGE }}:latest

      # ---------------------------------------------------------
      # UPDATE FRONTEND CONFIG REPOSITORY
      # ---------------------------------------------------------

      - name: Update Frontend Config Repository
        env:
          PAT_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
          FRONTEND_IMAGE: ${{ steps.vars.outputs.FRONTEND_IMAGE }}
          IS_PROD: ${{ steps.vars.outputs.IS_PROD }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone \
            "https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository_owner }}/REPO_EXPLORER_FRONTEND_CONFIG.git" \
            frontend-config

          cd frontend-config

          if [ "$IS_PROD" = "true" ]; then
            FILES="values_prod.yaml"
          else
            FILES="values_dev.yaml values_test.yaml"
          fi

          for f in $FILES; do
            if [ -f "$f" ]; then
              # Update repository
              sed -i -E \
                '/^[[:space:]]*image:/,/^[^[:space:]]/ {
                  s|^([[:space:]]*repository:)[[:space:]]*.*|\1 '"$FRONTEND_IMAGE"'|
                  s|^([[:space:]]*tag:)[[:space:]]*.*|\1 '"$COMMIT_SHA"'|
                }' "$f"

              git add "$f"
            else
              echo "File $f does not exist, skipping."
            fi
          done

          if git diff --cached --quiet; then
            echo "No frontend config changes to commit."
          else
            if [ "$IS_PROD" = "true" ]; then
              git commit -m "chore(frontend): update prod image tag to $COMMIT_SHA"
            else
              git commit -m "chore(frontend): update dev and test image tags to $COMMIT_SHA"
            fi

            git push origin main
          fi

      # ---------------------------------------------------------
      # UPDATE BACKEND CONFIG REPOSITORY
      # ---------------------------------------------------------

      - name: Update Backend Config Repository
        env:
          PAT_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
          BACKEND_IMAGE: ${{ steps.vars.outputs.BACKEND_IMAGE }}
          IS_PROD: ${{ steps.vars.outputs.IS_PROD }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone \
            "https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository_owner }}/REPO_EXPLORER_BACKEND_CONFIG.git" \
            backend-config

          cd backend-config

          if [ "$IS_PROD" = "true" ]; then
            FILES="values_prod.yaml"
          else
            FILES="values_dev.yaml values_test.yaml"
          fi

          for f in $FILES; do
            if [ -f "$f" ]; then
              # Update repository
              sed -i -E \
                '/^[[:space:]]*image:/,/^[^[:space:]]/ {
                  s|^([[:space:]]*repository:)[[:space:]]*.*|\1 '"$BACKEND_IMAGE"'|
                  s|^([[:space:]]*tag:)[[:space:]]*.*|\1 '"$COMMIT_SHA"'|
                }' "$f"

              git add "$f"
            else
              echo "File $f does not exist, skipping."
            fi
          done

          if git diff --cached --quiet; then
            echo "No backend config changes to commit."
          else
            if [ "$IS_PROD" = "true" ]; then
              git commit -m "chore(backend): update prod image tag to $COMMIT_SHA"
            else
              git commit -m "chore(backend): update dev and test image tags to $COMMIT_SHA"
            fi

            git push origin main
          fi
